<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Recipe</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css"/>
  
  <style>
    header{background-color: #fdf6f0; text-align: center;padding-bottom: 3px;}
    header h1{font-size: 4rem;}
    .wrap{max-width:900px;margin:0 auto;padding:1rem}
    .hero{display:grid;grid-template-columns:280px 1fr;gap:1rem;align-items:start}
    .hero img{width:100%;border-radius:12px;display:block}
    #content {display: block; margin-top: 1rem;background-color:light-dark( #d2886a,#242424); padding: 3%; border-radius: 12px;box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;}
    table{border-collapse:collapse;width:100%;border: 2px solid light-dark(#43270F,#eee); background-color:light-dark(#fdf6f0,#353535);}
    td,th{border:1px solid #eee;padding:.5rem .6rem;border: 2px solid light-dark(#43270F,#eee);}
    h1,h2{margin:.6rem 0}
    #arrow{font-size:2rem;text-decoration:none;color:#43270F;}
    html[data-theme="dark"] {
      header{background-color: #121212;}
      #content {background-color:#242424;box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;}
       #lightBtn, #darkBtn {border: 2px solid #F5F5F5 ;}
      table{border: 2px solid #eee; background-color:#353535;}
      td,th{border: 2px solid #eee;}
      #arrow{color:#F5F5F5;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a  href="index.html"><i id="arrow" class="fa-solid fa-arrow-left-long"></i></a>
    
      <div class="light-dark">  
      <button id="lightBtn" onclick="switchLight()" aria-label="Light mode"><i class="fa-solid fa-sun"></i></button>
      <button id="darkBtn" onclick="switchDark()" aria-label="Dark mode">
    <i class="fa-solid fa-moon"></i>
      </div>
  </button>
  <header>    
    
    <h1><i id="utensils" class="fa-solid fa-utensils"></i>  Recipes Finder</h1>
    
    </header>
    <div id="content">Loading…</div>
  </div>
  <script type="module" src="js/app-recipe.js"></script>
</body>
</html>
