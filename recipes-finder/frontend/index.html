<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Maaltidspreik</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <a href="chat.html" class="btn btn-outline-primary"><i id="chatbot" class="fa-solid fa-robot"></i></a> <br><br>                                                                                                                                                                 
    <div class="header">  
    <div class="light-dark">  
      <button id="lightBtn" onclick="switchLight()" aria-label="Light mode"><i class="fa-solid fa-sun"></i></button>
      <button id="darkBtn" onclick="switchDark()" aria-label="Dark mode">
    <i class="fa-solid fa-moon"></i>
  </button>
    </div>
    <div class="title">
    
    <h1><i id="utensils" class="fa-solid fa-utensils"></i>Recipes Finder</h1>
    </div>

  <form id="filters-form" class="filters">
    <div class="filter_group">
    <label>Category
      <select id="filter-category"><option value="">All</option></select>
    </label></div>
    <div class="filter_group">
    <label>Area
      <select id="filter-area"><option value="">All</option></select>
    </label></div>
    <div class="filter_group">                       
    <label>Tags
      <select id="filter-tags"><option value="">All</option></select>
    </label></div>
    <div class="filter_group">
    <label>Search
      <input id="filter-query" placeholder="e.g. pasta"/>
    </label></div>
    <br><br>
    <div class="buttons">
    <button type="submit"><i id="search" class="fa-solid fa-magnifying-glass"></i>Search</button>
    <button type="button" id="clear-filters"><i id="clear" class="fa-solid fa-broom"></i>Clear</button>
    </div>
  </form>
</div>

  <ul id="meal-list" class="grid"></ul>

  <button id="load-more" style="margin:1rem auto; display:block;">Load more</button>
</div>
  <script type="module" src="js/app-index.js"></script>
</body>
</html>
