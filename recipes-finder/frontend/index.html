<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Maaltidspreik</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem;list-style:none;padding:0}
    .card{border:1px solid #eee;border-radius:12px;overflow:hidden;background-color: #1E1E1E;box-shadow:0 2px 6px rgba(0,0,0,.1);transition:transform .2s}
    .card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
    .meta{padding:.5rem .75rem .75rem}
    .filters{display:flex;flex-wrap:wrap;gap:.5rem;margin:.75rem 0}
    .filters label{font-size:1.3rem}
  </style>
</head>
<body>
  <div class="container">                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
    <div class="header">  
    <div class="light-dark">  
      <button id="lightBtn" onclick="switchLight()" aria-label="Light mode"><i class="fa-solid fa-sun"></i></button>
      <button id="darkBtn" onclick="switchDark()" aria-label="Dark mode">
    <i class="fa-solid fa-moon"></i>
  </button>
    </div>
      <h1>Recipes Finder</h1>                                                    

  <form id="filters-form" class="filters">
    <div class="filter_group">
    <label>Category
      <select id="filter-category"><option value="">All</option></select>
    </label></div>
    <div class="filter_group">
    <label>Area
      <select id="filter-area"><option value="">All</option></select>
    </label></div>
    <div class="filter_group">                       
    <label>Tags
      <select id="filter-tags"><option value="">All</option></select>
    </label></div>
    <div class="filter_group">
    <label>Search
      <input id="filter-query" placeholder="e.g. pasta"/>
    </label></div>
    <br><br>
    <div class="buttons">
    <button type="submit">Search</button>
    <button type="button" id="clear-filters">Clear</button>
    </div>
  </form>
</div>

  <ul id="meal-list" class="grid"></ul>

  <button id="load-more" style="margin:1rem auto; display:block;">Load more</button>
</div>
  <script type="module" src="js/app-index.js"></script>
</body>
</html>
