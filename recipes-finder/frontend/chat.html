<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Recipe Chat</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@xenova/transformers/dist/transformers.min.js"></script>
  <style>
    .chat { max-width: 900px; margin: 2rem auto; }
    .msg { border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background:#fff; }
    .msg-user { background: #e7f1ff; }
    .sources small { display:block; opacity:.85; }
  </style>
</head>
<body>
  <div class="chat container">
    <h1 class="mb-2">Recipe Assistant</h1>
    <p class="text-muted">Ask for meal ideas based on our recipes. Answers include links.</p>

    <div id="stream" class="mb-3"></div>

    <form id="ask" class="d-flex gap-2">
      <input id="q" class="form-control" placeholder="e.g. quick chicken dinner without dairy">
      <button class="btn btn-primary">Ask</button>
      <button id="lucky" type="button" class="btn btn-outline-secondary">Suggest a meal</button>
    </form>

    <div class="mt-3 small text-muted" id="status">Loading models… first load can take a bit.</div>
  </div>

  <script type="module" src="js/chat.js"></script>
</body>
</html>
