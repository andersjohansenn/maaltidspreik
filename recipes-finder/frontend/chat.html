<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipes Finder – Chat</title>

  <!-- Bootstrap -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Your global styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body style="background-color: #FCF6F1;">

  <!-- HERO PANEL (same width + style as index) -->
  <div class="container my-4 my-md-5">
    <div class="rf-hero shadow-sm" style="background-color:#C88C70;">
      
      <!-- Top row: left icon + right icons EXACT like index -->
      <div class="d-flex justify-content-between align-items-start mb-3">
        
        <!-- Left icon box (same as index) -->
        <div class="rf-icon-box d-flex align-items-center justify-content-center">
          <img src="assets/icon-bot.svg" width="22" height="22" alt="">
        </div>

        <!-- Right side toggle boxes (matching index.html) -->
        <div class="d-flex gap-2">
          <div class="rf-icon-box d-flex align-items-center justify-content-center">
            <img src="assets/icon-settings.svg" width="18" height="18" alt="">
          </div>
          <div class="rf-icon-box d-flex align-items-center justify-content-center">
            <img src="assets/icon-moon.svg" width="18" height="18" alt="">
          </div>
        </div>
      </div>

      <!-- Title -->
      <div class="text-center">
        <h1 class="rf-title">Recipes Finder – Chat</h1>
        <p class="rf-subtitle mx-auto mt-2" style="max-width:650px;">
          Ask for ideas or describe what you want. The chat suggests options based on your recipe collection and links you directly to them.
        </p>
      </div>

    </div>
  </div>

  <!-- CHAT CARD -->
  <main class="container mb-5">
    <div class="row justify-content-center">
      <div class="col-xl-8 col-lg-10">

        <div class="rf-chat-card shadow-sm">
          <div class="rf-chat-card-body">

            <!-- MESSAGES -->
            <div id="stream" class="rf-chat-messages"></div>

            <!-- INPUT -->
            <form id="ask" class="rf-chat-input d-flex gap-2">
              <input 
                id="q"
                class="form-control rf-chat-input-field"
                placeholder="e.g. 'easy dish without chicken' or 'warm dish with pasta'"
              >
              <button class="btn rf-primary-btn">Send</button>
              <button id="lucky" type="button" class="btn rf-secondary-btn d-none d-md-inline-block">I'm feeling lucky</button>
            </form>

            <!-- STATUS -->
            <div id="status" class="rf-chat-status small text-muted mt-2">
              Loading… this may take a moment the first time.
            </div>

          </div>
        </div>

      </div>
    </div>
  </main>

  <script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    defer>
  </script>

  <script type="module" src="./js/chat.js?v=8"></script>
</body>
</html>
