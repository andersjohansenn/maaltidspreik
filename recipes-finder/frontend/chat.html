<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipes Finder – Chat</title>

  <!-- Bootstrap (same version as index) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Font Awesome (for icons, including the back arrow) -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-M9WZ3COpk0nwkL1pB4G0+Zp+qT7R4iM3tG5aT7qtfbQP1XUqz5GZlYxIThQ0V9GeFvE1uJ9ZLiydCwCwS9KQ=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />

  <!-- Your global styles -->
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/chat-styles.css" />
</head>

<body class="rf-chat-body">

  <!-- HERO PANEL (same width as index: wrapped in .container) -->
  <div class="container my-4 my-md-5">
    <div class="rf-chat-hero shadow-sm">
      <div class="d-flex justify-content-between align-items-start mb-3">
        <!-- Left icon box -->
        <div class="rf-chat-icon-box d-flex align-items-center justify-content-center">
          <i class="fa-solid fa-robot"></i>
        </div>

        <!-- Right icon boxes (match settings / theme idea) -->
        <div class="d-flex gap-2">
          <div class="light-dark">  
            <button id="lightBtn" onclick="switchLight()" aria-label="Light mode"><i class="fa-solid fa-sun"></i></button>
            <button id="darkBtn" onclick="switchDark()" aria-label="Dark mode">
              <i class="fa-solid fa-moon"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="text-center">
        <h1 class="rf-chat-title">Recipes Finder – Chat</h1>
        <p class="rf-chat-subtitle mx-auto">
          Ask for ideas, describe what you want, or mention what to avoid.
          The chat uses the same recipes as the main page and links you straight to them.
        </p>
      </div>
    </div>
  </div>

  <!-- CHAT AREA (same container width as hero) -->
  <main class="container mb-5">
    <div class="row justify-content-center">
      <div class="col-xl-8 col-lg-10">

        <div class="rf-chat-card shadow-sm">
          <div class="rf-chat-card-body">

            <!-- Back link row, uses same arrow icon as recipes.html -->
            <div class="d-flex align-items-center mb-3 gap-2">
              <a href="index.html" class="rf-chat-back-link d-inline-flex align-items-center" style="text-decoration: underline;">
                <i class="fa-solid fa-arrow-left-long me-2"></i>
                <span>Back to recipes</span>
              </a>
            </div>

            <!-- Messages -->
            <div id="stream" class="rf-chat-messages">
              <!-- messages injected by chat.js -->
            </div>

            <!-- Input row -->
            <form id="ask" class="rf-chat-input d-flex gap-2">
              <input
                id="q"
                class="form-control rf-chat-input-field"
                placeholder="e.g. 'easy dish without chicken' or 'warm dish with pasta'"
              >
              <button class="btn rf-chat-primary-btn">
                Send
              </button>
              <button
                id="lucky"
                type="button"
                class="btn rf-chat-secondary-btn d-none d-md-inline-block"
              >
                I'm feeling lucky
              </button>
            </form>

            <!-- Status -->
            <div id="status" class="rf-chat-status small text-muted mt-2">
              Loading… this may take a moment the first time.
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    defer
  ></script>

  <script type="module" src="./js/chat.js?v=9"></script>
  <script>
    const htmlRoot = document.documentElement;
    const lightBtn = document.getElementById("lightBtn");
    const darkBtn = document.getElementById("darkBtn");

    window.switchLight = function () {
      htmlRoot.removeAttribute("data-theme");
      localStorage.setItem("theme", "light");
      lightBtn.classList.add("active");
      darkBtn.classList.remove("active");
    };

    window.switchDark = function () {
      htmlRoot.setAttribute("data-theme", "dark");
      localStorage.setItem("theme", "dark");
      darkBtn.classList.add("active");
      lightBtn.classList.remove("active");
    };

    // Load saved theme on page load
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") {
      htmlRoot.setAttribute("data-theme", "dark");
      darkBtn.classList.add("active");
    } else {
      lightBtn.classList.add("active");
    };
  </script>
</body>
</html>
